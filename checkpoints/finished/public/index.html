<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow-up tracker</title>
<style>
  :root { --bg: #f7f5f0; --card: #fdfcf9; --ink: #16202e; --muted: #4a5568; --line: #ddd7cb; --accent: #9e4220; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .count { color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  li.done { opacity: 0.5; }
  li.done .what { text-decoration: line-through; }
  .body { flex: 1; }
  .who { font-weight: 600; }
  .what { margin: 4px 0; }
  .meta { color: var(--muted); font-size: 14px; }
  button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .error { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Follow-up tracker</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="cols">
    <section>
      <h2>Waiting on others <span class="count" id="waiting-count"></span></h2>
      <ul id="waiting"></ul>
    </section>
    <section>
      <h2>My promises <span class="count" id="promises-count"></span></h2>
      <ul id="promises"></ul>
    </section>
  </div>
</main>
<script>
  // "Mark done" is remembered in this browser only. Nothing is sent anywhere.
  const KEY = "followups-done";
  function loadDone() {
    try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch { return new Set(); }
  }
  function saveDone(done) {
    try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch {}
  }

  let data = null;
  const done = loadDone();

  function item(id, title, text, meta) {
    const li = document.createElement("li");
    if (done.has(id)) li.classList.add("done");
    const body = document.createElement("div");
    body.className = "body";
    for (const [cls, value] of [["who", title], ["what", text], ["meta", meta]]) {
      const div = document.createElement("div");
      div.className = cls;
      div.textContent = value;
      body.appendChild(div);
    }
    const button = document.createElement("button");
    button.textContent = done.has(id) ? "Undo" : "Mark done";
    button.onclick = () => {
      done.has(id) ? done.delete(id) : done.add(id);
      saveDone(done);
      render();
    };
    li.append(body, button);
    return li;
  }

  function fill(listId, countId, items, toItem, dateOf) {
    const list = document.getElementById(listId);
    list.replaceChildren();
    const sorted = [...items].sort((a, b) => dateOf(a).localeCompare(dateOf(b))); // oldest first
    const open = sorted.filter((x) => !done.has(x.id)).length;
    document.getElementById(countId).textContent = `(${open} open)`;
    for (const x of sorted) list.appendChild(toItem(x));
  }

  function render() {
    document.getElementById("sub").textContent = `As of ${data.today}`;
    fill("waiting", "waiting-count", data.waiting_on_others || [],
      (w) => item(w.id, w.person, w.asked, `Asked ${w.asked_on} · ${w.days_waiting} days waiting${w.note ? " · " + w.note : ""}`),
      (w) => w.asked_on);
    fill("promises", "promises-count", data.my_promises || [],
      (p) => item(p.id, p.to, p.promise, `Due ${p.due} · ${p.status}${p.note ? " · " + p.note : ""}`),
      (p) => p.made_on);
  }

  fetch("/data/followups.json")
    .then((r) => r.json())
    .then((json) => { data = json; render(); })
    .catch(() => {
      document.getElementById("sub").innerHTML = '<span class="error">Couldn\'t load data/followups.json. Run checkpoint 3 first.</span>';
    });
</script>
</body>
</html>
